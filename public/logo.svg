<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Circuit Trace Lines -->
  <path d="M 64 256 H 180 M 64 160 H 180 M 64 352 H 180" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <path d="M 332 256 H 448 M 332 160 H 448 M 332 352 H 448" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" opacity="0.6"/>

  <!-- Connection Nodes -->
  <circle cx="64" cy="160" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="64" cy="256" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="64" cy="352" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="448" cy="160" r="14" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="448" cy="256" r="14" fill="#3b82f6" filter="url(#glow)"/>
  <circle cx="448" cy="352" r="14" fill="#3b82f6" filter="url(#glow)"/>

  <!-- Central Logic Microchip Frame -->
  <rect x="160" y="120" width="192" height="272" rx="32" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="14" filter="url(#glow)"/>

  <!-- AND/OR Gate Symbol inside Chip -->
  <path d="M 210 180 H 260 C 295 180 315 210 315 256 C 315 302 295 332 260 332 H 210 Z" fill="none" stroke="url(#amberGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 180 216 H 210 M 180 296 H 210 M 315 256 H 345" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>

  <!-- Core Pulse Light -->
  <circle cx="256" cy="256" r="16" fill="#10b981" filter="url(#glow)"/>
</svg>
